name: Update Contribution Graph

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday 6am UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        run: node screenshot.js
        env:
          GITHUB_USERNAME: santhoshkammari

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/santhoshkammari/profile-assets.git
          git add contribution-graph.png
          git diff --staged --quiet || git commit -m "Update contribution graph"
          git push
